[package]
name = "edos-kernel"
version = "0.1.0-alpha.6"
edition = "2024"

[features]
default = []
test = []
trace = []
sched-test = []

[dependencies]
limine = "0.6"
spin = "0.10.0"
x86_64 = "0.15.4"
uart_16550 = { version = "0.4.0", features = ["nightly"] }
x2apic = "0.5.0"
acpi = { version = "6.1.1" }
pc-keyboard = "0.8.0"
crossbeam-queue = { version = "0.3.12", default-features = false, features = [
    "alloc",
    "nightly",
] }
thiserror = { version = "2.0.18", default-features = false }
bytemuck = { version = "1.25.0", features = ["latest_stable_rust", "extern_crate_alloc", "nightly_portable_simd", "nightly_stdsimd", "nightly_docs"] }
pic8259 = "0.11.0"
raw-cpuid = "11.6.0"
lru = { version = "0.16.3", features = ["nightly"] }
heapless = "0.9.2"
buddy_system_allocator = "0.12.0"
bitflags = { version = "2.11.0", default-features = false, features = ["bytemuck"] }
intrusive-list = { path = "../libs/intrusive_list" }
efs-common = { path = "../libs/efs-common" }

[profile.dev]
opt-level = 2
