[package]
name = "edos-kernel"
version = "0.8.0"
edition = "2024"

[features]
default = []
test = []
trace = []
sched-test = []
## Times each step of the voluntary context switch into `/proc/sched_prof`.
## Adds a clock read per stage to the switch path, so leave it off outside a
## measurement and take the numbers on a single-CPU boot.
sched-prof = []
## Spawns a kthread that acquires rank 10 then rank 20 and verifies no panic.
## Prints "lock-order self-test PASS" and returns normally.
lock-order-self-test = []
## Spawns a kthread that acquires rank 20 then rank 10 (inversion) and is
## EXPECTED to panic, halting the machine. Run in isolation with
## `make run-single`. Halts the machine by design.
lock-order-self-test-inversion = []
## Records the tid and call site of every live WINDOW_REGISTRY reader in
## `WINDOW_REGISTRY_READERS`, so a reader that parks without releasing can be
## named from outside the guest. Silent: no logging, no allocation.
window-lock-debug = []
## Stamps every freed heap block and panics on a block freed twice, naming the
## address and size at the second free. Costs a memset per free, so it is a
## debugging build rather than something to leave on.
heap-poison = []
## Prints every thread and the stack it is blocked on when the machine runs
## nothing for eight seconds. Costs one relaxed increment per context switch,
## so it is a debugging build pointed at a workload that should never be idle.
stall-dump = []
## Exposes `/dev/journal-ctl`, which pauses journal checkpointing on demand so
## an unclean cut has committed transactions left to replay. Recovery is
## otherwise unreachable from a test: a clean unmount replays nothing, and
## writeback checkpoints faster than a crash can be timed.
fault-inject = []

[dependencies]
limine = "0.6"
spin = "0.12.2"
# Pinned exactly: 0.15.5 implements `Step::{forward,backward}_overflowing`,
# which the current nightly does not have, so it fails to compile with E0407.
# The unstable `step_trait` API added those methods and removed them again
# (rust-osdev/x86_64#595, #597). Relax once a release builds on plain nightly.
x86_64 = "=0.15.4"
uart_16550 = "0.6.0"
x2apic = "0.5.0"
acpi = { version = "6.1.1" }
pc-keyboard = "0.9.0"
crossbeam-queue = { version = "0.3.12", default-features = false, features = [
    "alloc",
    "nightly",
] }
thiserror = { version = "2.0.18", default-features = false }
bytemuck = { version = "1.25.0", features = ["latest_stable_rust", "extern_crate_alloc", "nightly_portable_simd", "nightly_stdsimd", "nightly_docs"] }
pic8259 = "0.11.0"
raw-cpuid = "11.6.0"
lru = { version = "0.18.2", features = ["nightly"] }
heapless = "0.9.2"
buddy_system_allocator = "0.13.0"
bitflags = { version = "2.11.0", default-features = false, features = ["bytemuck"] }
intrusive-list = { path = "../libs/intrusive_list" }
efs-common = { path = "../libs/efs-common" }
edos-trace-abi = { path = "../libs/edos-trace-abi" }
edos-profile-abi = { path = "../libs/edos-profile-abi" }
syscall-abi = { path = "../libs/syscall-abi" }
window-abi = { path = "../libs/window-abi" }

# `unsafe` is documented twice, for two readers: `// SAFETY:` above a block says
# why this operation upholds a contract, `# Safety` on an item says what the
# contract is. `doc/rust-style.md` states the rule. The two `unnecessary_*`
# lints are what stop the cheapest way to satisfy the first from being a
# comment that says nothing.
[lints.clippy]
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
allow_attributes_without_reason = "warn"
# The fourth of the set. It reports 662 blocks today, which is
# `doc/ROADMAP-CLEANUP.md` §I5a's remaining work; turning it on is the commit
# that finishes that entry, and a blanket allow to turn it on sooner is exactly
# what the other three lints exist to prevent. A module that is finished denies
# it on its own `mod` declaration in `main.rs` instead, so the work ratchets.
# undocumented_unsafe_blocks = "warn"

[profile.dev]
opt-level = 2
