name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            xorriso \
            mtools \
            gdisk \
            qemu-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-none

      - name: Build release artifacts
        run: |
          make clean
          make filesystem
          make all
          mkdir -p artifacts
          tar -czf artifacts/filesystem.tar.gz filesystem
          cp edos-x86_64.iso artifacts/
          cp scripts/create-filesystem-image.sh artifacts/
          chmod +x artifacts/create-filesystem-image.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/edos-x86_64.iso
            artifacts/filesystem.tar.gz
            artifacts/create-filesystem-image.sh
          name: edos ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
