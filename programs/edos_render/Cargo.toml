[package]
name = "edos_render"
version = "0.1.0"
edition = "2024"

[dependencies]
edos_lib = { path = "../edos_lib" }
# The default unicode range is Basic Latin alone, so every accented character
# rasterizes to nothing and reads on screen as a space. A Spanish ISO keyboard
# puts four of them one keystroke away.
noto-sans-mono-bitmap = { version = "0.3.1", features = [
    "bold",
    "size_24",
    "size_32",
    "unicode-latin-1-supplement",
    "unicode-latin-extended-a",
] }

