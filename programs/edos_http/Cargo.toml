[package]
name = "edos_http"
version = "0.1.0"
edition = "2024"

[dependencies]
edos_lib = { path = "../edos_lib" }

# URL parsing, reference resolution, percent-encoding and IDNA, per the WHATWG
# URL Standard. `rustls` and the resolver both take the ASCII form of a host and
# neither performs IDNA, so the punycoding this does on the way in is what makes
# a non-ASCII hostname reachable at all.
url = "2"

# rustls must lose its defaults: they pull `aws_lc_rs`, which needs a C
# toolchain and NASM. `rustls-rustcrypto` must KEEP its defaults, which is the
# opposite of every other crypto crate here -- `default-features = false`
# strips its `alloc` feature and it answers with a compile_error.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
# Transfer compression. Every other user of it in the tree takes the same
# rust_backend, since the C one wants a toolchain this target has not got.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustls-rustcrypto = "0.0.2-alpha"
webpki-roots = "1"

# Reaches this crate through rand_core 0.6 under elliptic-curve and rsa. On an
# unrecognised target its unmodified form is a compile_error; `custom` replaces
# that with the registration hook in tls.rs.
getrandom = { version = "0.2", features = ["custom"] }

[lints]
workspace = true
