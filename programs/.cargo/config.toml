[build]
target = "x86_64-unknown-edos"
# Frame pointers are kept for the same reason the kernel keeps them: `rbp` is
# how the profiler walks a stack. LLVM omits them in optimized code, and only
# about half the functions in an optimized Rust binary leave one behind, so a
# walk without this reads whatever a function happened to put there and invents
# callers. The cost is one register and a two-instruction prologue.
rustflags = ["-C", "force-frame-pointers=yes"]
