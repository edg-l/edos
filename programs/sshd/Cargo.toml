[package]
name = "sshd"
version = "0.1.0"
edition = "2024"

[dependencies]
edos_lib = { path = "../edos_lib" }
# Every crate here is `default-features = false`: the defaults pull `getrandom`,
# which has no backend for this target. Randomness comes from `SYS_GETRANDOM`
# through `edos_lib::getrandom` instead, and the key types are constructed from
# bytes rather than from an RNG the crate owns.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = [
    "static_secrets",
    "precomputed-tables",
] }
ed25519-dalek = { version = "2", default-features = false, features = [
    "fast",
    "zeroize",
] }
subtle = { version = "2", default-features = false }

[lints]
workspace = true
