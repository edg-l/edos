# Timeout in seconds that Limine will use before automatically booting.
timeout: 1

# The entry name that will be displayed in the boot menu.
/edos
    # We use the Limine boot protocol.
    protocol: limine
    resolution: 1920x1080

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/kernel
    cmdline: root=UUID=87654321-4321-8765-cba9-987654321fed rootfstype=efs

    # Live root: a complete GPT image mounted as the root filesystem when no
    # installed disk carries the same partition GUID. Writable, in RAM, and
    # discarded on reboot.
    module_path: boot():/boot/live-root.img

/edos (live root)
    protocol: limine
    resolution: 1920x1080
    kernel_path: boot():/boot/kernel
    cmdline: root=live rootfstype=efs
    module_path: boot():/boot/live-root.img
